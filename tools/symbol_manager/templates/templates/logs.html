<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Service Metrics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Service Metrics</h1>
  <table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Timestamp</th><th>Service</th><th>Metric</th><th>Value</th><th>Labels</th></tr>
    {% for ts, svc, metric, value, labels in rows %}
      <tr>
        <td>{{ ts }}</td><td>{{ svc }}</td><td>{{ metric }}</td><td>{{ value }}</td><td>{{ labels }}</td>
      </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('index') }}">Back to menu</a></p>
</body>
</html>
